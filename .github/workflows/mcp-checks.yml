name: MCP and learning core checks

on:
  push:
    branches:
      - feature/secure-chatgpt-mcp
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Verify unchanged REST build
        run: npm run build
      - name: Verify separate MCP build
        run: npm run build:mcp
      - name: Unit and existing regression tests
        run: npm test
