name: One-time PostgreSQL driver lockfile update
on:
  push:
    branches:
      - feature/secure-chatgpt-mcp
    paths:
      - .github/workflows/lock-postgres-driver.yml
permissions:
  contents: write
jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Add locked PostgreSQL driver without running lifecycle scripts
        run: npm install --save --package-lock-only --ignore-scripts pg@8.16.3
      - name: Verify reproducible npm lock
        run: npm ci --ignore-scripts
      - name: Commit exact package manifest and lock changes to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'No lockfile change needed'
          else
            git commit -m 'build(db): lock PostgreSQL runtime driver for hosted MCP'
            git push origin HEAD:feature/secure-chatgpt-mcp
          fi
